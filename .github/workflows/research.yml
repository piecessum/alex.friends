# Исследования: превью + публикация в Telegram-канал.
# Генератор через OpenAI API готовит один материал в день, затем:
#   1) рисуем превью (Cloudflare Workers AI, бесплатно) и коммитим (пуш запускает деплой Vercel);
#   2) ждём, пока новое исследование откроется на сайте;
#   3) постим в канал и коммитим отметку telegram.messageId.
# Раз в час — публикация отложенных (поле telegramAt).
# Нужны секреты OPENAI_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, TELEGRAM_BOT_TOKEN
# (бот — админ канала). PEXELS_API_KEY — превью из стоковых фото (без него
# предмет рисует нейросеть).

name: Research publish

on:
  push:
    branches: [main]
    paths: ["content/research/*.json", "content/research/digests/*.json"]
  # Раз в час — запас исследований уходит в канал по своему telegramAt.
  schedule:
    # Подготовить газету к утру; ежечасный запуск также повторит неудачную попытку.
    - cron: "5 5 * * 1-6"
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      generate:
        description: "Подготовить сегодняшнюю статью / субботний дайджест"
        type: boolean
        required: false
        default: false
      refresh:
        description: "Перерисовать превью и обновить пост в канале (slug через запятую)"
        required: false
        default: ""
      image_model:
        description: "Модель Cloudflare для превью (пусто — по умолчанию)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: research-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'gpt-5.4' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      RESEARCH_CHANNEL_ID: ${{ secrets.RESEARCH_CHANNEL_ID }}
      SITE_URL: https://alex-friends.vercel.app
      REFRESH: ${{ inputs.refresh }}
      CLOUDFLARE_IMAGE_MODEL: ${{ inputs.image_model }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверки генератора
        run: npm run research:test

      - name: Подготовка утренней газеты
        id: generate
        if: github.event_name == 'schedule' || inputs.generate == true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # До 08:00 Next.js исключает будущий выпуск из статической сборки.
          hour=$(TZ=Europe/Moscow date +%H)
          if [ "$hour" -lt 8 ]; then
            echo "Сегодняшний выпуск готовим после 08:00 МСК."
            exit 0
          fi
          if [ -z "$OPENAI_API_KEY" ] && [ "$EVENT_NAME" = schedule ]; then
            echo "::warning::Генерация не подключена: добавьте секрет OPENAI_API_KEY. Обработка готовых материалов продолжится."
            echo "Генерация не подключена: нужен секрет OPENAI_API_KEY." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run research:generate
          if [ -n "$(git status --porcelain -- content/research)" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Проверка сборки нового выпуска
        if: steps.generate.outputs.created == 'true'
        run: npm run build

      # Модель вырезки объектов (lib/cutout.ts, ~160 МБ) — не качать каждый раз.
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: cutout-models-v1

      - run: git config user.name "Алексей Масюта" && git config user.email "alexmas1998kot@gmail.com"

      # Картинки из самих исследований (блоки image) — PyMuPDF достаёт их из PDF.
      - name: Картинки из исследований
        run: |
          pip install --quiet pymupdf pillow
          python3 scripts/research-figures.py fetch

      - name: Превью
        run: |
          npm run research:cover -- "$REFRESH"
          git add content/research public/research
          if ! git diff --cached --quiet; then
            git commit -m "research: превью"
            git pull --rebase -X theirs && git push || (sleep 5 && git pull --rebase -X theirs && git push)
          fi

      - name: Ждём деплой новых исследований
        run: |
          # Неопубликованные исследования, дата которых наступила.
          slugs=$(node -e '
            const fs = require("fs");
            const dir = "content/research";
            for (const f of fs.readdirSync(dir).filter((f) => f.endsWith(".json"))) {
              const r = JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8"));
              const refresh = (process.env.REFRESH || "").split(",").includes(r.slug);
              if ((!r.telegram || refresh) && r.cover && new Date(r.telegramAt ?? r.date) <= new Date()) console.log(`${r.slug} ${r.cover}`);
            }
            // Дайджесты недели — страница /research/week/<slug>.
            const dd = `${dir}/digests`;
            if (fs.existsSync(dd)) for (const f of fs.readdirSync(dd).filter((f) => f.endsWith(".json"))) {
              const d = JSON.parse(fs.readFileSync(`${dd}/${f}`, "utf8"));
              if (!d.telegram && d.cover && new Date(d.date) <= new Date()) console.log(`week/${d.slug} ${d.cover}`);
            }')
          echo "$slugs"
          [ -z "$slugs" ] && exit 0
          # До 15 минут ждём, пока страница И превью открываются на сайте.
          for i in $(seq 1 90); do
            ok=1
            while read -r slug cover; do
              [ -z "$slug" ] && continue
              p=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/research/$slug")
              c=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL$cover")
              [ "$p" = 200 ] && [ "$c" = 200 ] || ok=0
            done <<< "$slugs"
            [ $ok = 1 ] && echo "задеплоено" && exit 0
            sleep 10
          done
          echo "::error::Сайт так и не отдал новые исследования — в канал не постим"
          exit 1

      - name: Публикация в канал
        run: |
          npm run research:publish -- "--refresh=$REFRESH"
          git add content/research
          if ! git diff --cached --quiet; then
            git commit -m "research: опубликовано в канал"
            git pull --rebase -X theirs && git push || (sleep 5 && git pull --rebase -X theirs && git push)
          fi
